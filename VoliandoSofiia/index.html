<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапер · Minesweeper | Lab1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="game-container">
        <header class="header">
            <div class="counter">
                <span>💣</span>
                <span class="counter-value" id="minesCount">010</span>
            </div>
            
            <button type="button" class="new-game" id="newGameBtn" aria-label="New game">😊</button>
            
            <div class="counter">
                <span>⏱️</span>
                <span class="counter-value" id="timer">000</span>
            </div>
        </header>

        <!-- Ігрове поле 10x10 з демонстрацією різних станів клітинок -->
        <div class="board">
            <!-- Рядок 1 - Відкриті клітинки з цифрами -->
            <button type="button" class="cell open" data-number="1" aria-label="Row 1, column 1, opened, 1 mine">1</button>
            <button type="button" class="cell open" data-number="2" aria-label="Row 1, column 2, opened, 2 mines">2</button>
            <button type="button" class="cell open" data-number="3" aria-label="Row 1, column 3, opened, 3 mines">3</button>
            <button type="button" class="cell open" data-number="4" aria-label="Row 1, column 4, opened, 4 mines">4</button>
            <button type="button" class="cell closed" aria-label="Row 1, column 5, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 1, column 6, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 1, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 1, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 1, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 1, column 10, closed"></button>
            
            <!-- Рядок 2 - Прапорці та міни -->
            <button type="button" class="cell flag" aria-label="Row 2, column 1, flagged">🚩</button>
            <button type="button" class="cell flag" aria-label="Row 2, column 2, flagged">🚩</button>
            <button type="button" class="cell mine" aria-label="Row 2, column 3, mine">💣</button>
            <button type="button" class="cell open" data-number="1" aria-label="Row 2, column 4, opened, 1 mine">1</button>
            <button type="button" class="cell closed" aria-label="Row 2, column 5, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 2, column 6, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 2, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 2, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 2, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 2, column 10, closed"></button>
            
            <!-- Рядок 3 - Відкриті порожні клітинки -->
            <button type="button" class="cell open" aria-label="Row 3, column 1, opened, empty"></button>
            <button type="button" class="cell open" data-number="1" aria-label="Row 3, column 2, opened, 1 mine">1</button>
            <button type="button" class="cell open" data-number="2" aria-label="Row 3, column 3, opened, 2 mines">2</button>
            <button type="button" class="cell closed" aria-label="Row 3, column 4, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 3, column 5, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 3, column 6, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 3, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 3, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 3, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 3, column 10, closed"></button>
            
            <!-- Рядок 4 -->
            <button type="button" class="cell closed" aria-label="Row 4, column 1, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 4, column 2, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 4, column 3, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 4, column 4, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 4, column 5, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 4, column 6, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 4, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 4, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 4, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 4, column 10, closed"></button>
            
            <!-- Рядок 5 -->
            <button type="button" class="cell closed" aria-label="Row 5, column 1, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 5, column 2, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 5, column 3, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 5, column 4, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 5, column 5, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 5, column 6, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 5, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 5, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 5, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 5, column 10, closed"></button>
            
            <!-- Рядок 6 -->
            <button type="button" class="cell closed" aria-label="Row 6, column 1, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 6, column 2, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 6, column 3, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 6, column 4, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 6, column 5, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 6, column 6, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 6, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 6, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 6, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 6, column 10, closed"></button>
            
            <!-- Рядок 7 -->
            <button type="button" class="cell closed" aria-label="Row 7, column 1, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 7, column 2, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 7, column 3, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 7, column 4, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 7, column 5, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 7, column 6, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 7, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 7, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 7, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 7, column 10, closed"></button>
            
            <!-- Рядок 8 -->
            <button type="button" class="cell closed" aria-label="Row 8, column 1, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 8, column 2, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 8, column 3, closed"></button>

            <button type="button" class="cell closed" aria-label="Row 8, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 8, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 8, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 8, column 10, closed"></button>
            
            <!-- Рядок 9 -->
            <button type="button" class="cell closed" aria-label="Row 9, column 1, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 9, column 2, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 9, column 3, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 9, column 4, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 9, column 5, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 9, column 6, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 9, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 9, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 9, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 9, column 10, closed"></button>
            
            <!-- Рядок 10 -->
            <button type="button" class="cell closed" aria-label="Row 10, column 1, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 10, column 2, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 10, column 3, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 10, column 4, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 10, column 5, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 10, column 6, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 10, column 7, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 10, column 8, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 10, column 9, closed"></button>
            <button type="button" class="cell closed" aria-label="Row 10, column 10, closed"></button>
        </div>

        <p id="game-message" role="status" aria-live="polite" class="game-message"></p>

        <div class="difficulty">
            <button type="button" class="active" data-diff="easy">Легкий (10x10)</button>
            <button type="button" data-diff="hard">Складний (16x16)</button>
        </div>
    </main>
</body>
</html>

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сапер</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🏁 САПЕР 🏁</h1>

      <div class="game-header">
        <div class="header-item">
          <div class="header-label">⏱️ Час</div>
          <div class="timer">0</div>
        </div>

        <button class="start-btn">Нова гра</button>

        <div class="header-item">
          <div class="header-label">🚩 Прапорці</div>
          <div class="flag-counter">0/10</div>
        </div>
      </div>

      <div class="game-field"></div>

      <div class="game-message" role="status" aria-live="polite"></div>
    </div>

    <div id="win-overlay" class="win-overlay">
      <div class="win-content">
        <img src="dog-with-butterfly-dog-butterfly-meme.gif" alt="Victory!" id="win-gif">
        <button class="close-overlay-btn">❌</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

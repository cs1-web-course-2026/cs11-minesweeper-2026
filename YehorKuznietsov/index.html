<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="game">

    <header class="game-header">
      <div class="info-box">⏱ <span class="timer">00:00</span></div>
      <div class="info-box">💣 <span class="mine-count">10</span></div>
      <button class="new-game">Нова гра</button>
    </header>

    <section class="board"></section>

    <section class="controls">
      
      <div class="status">Почніть гру</div>
      <button class="control-btn">Нова гра</button>
    </section>

    <p class="help">
      Лівий клік - відкрити клітинку, правий клік - поставити або прибрати прапорець.
    </p>

  </main>
  <script src="./script.js"></script>
</body>
</html>

<!-- У практичній роботі №1 створено візуальну частину гри Minesweeper за допомогою HTML та CSS.
У файлі index.html реалізовано хедер з таймером, лічильником мін і кнопкою нової гри, ігрове поле у вигляді сітки, панель керування та інструкцію.
У файлі styles.css описано вигляд відкритих і закритих клітинок, прапорців, чисел, кнопок та адаптивність інтерфейсу для малих екранів. -->

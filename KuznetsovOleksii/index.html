<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="game">
  <header class="game-header">
    <div class="counter">🚩 10</div>
    <button type="button" class="restart" aria-label="Restart game">🙂</button>
    <div class="timer">000</div>
  </header>

  <div class="field">
    <button type="button" class="cell closed" aria-label="row 1 col 1 closed"></button>
    <button type="button" class="cell closed" aria-label="row 1 col 2 closed"></button>
    <button type="button" class="cell closed flag" aria-label="row 1 col 3 flag"></button>
    <button type="button" class="cell closed" aria-label="row 1 col 4 closed"></button>
    <button type="button" class="cell closed" aria-label="row 1 col 5 closed"></button>
    <button type="button" class="cell open" aria-label="row 1 col 6 open 1">1</button>
    <button type="button" class="cell open" aria-label="row 1 col 7 open 2">2</button>
    <button type="button" class="cell mine" aria-label="row 1 col 8 mine"></button>

    <button type="button" class="cell closed"></button>
    <button type="button" class="cell open">1</button>
    <button type="button" class="cell open">2</button>
    <button type="button" class="cell open">3</button>
    <button type="button" class="cell mine"></button>
    <button type="button" class="cell open">1</button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>

    <button type="button" class="cell closed"></button>
    <button type="button" class="cell open">1</button>
    <button type="button" class="cell mine clicked"></button>
    <button type="button" class="cell open">2</button>
    <button type="button" class="cell open">1</button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed flag"></button>
    <button type="button" class="cell closed"></button>

    <button type="button" class="cell closed"></button>
    <button type="button" class="cell open">2</button>
    <button type="button" class="cell open">3</button>
    <button type="button" class="cell open">2</button>
    <button type="button" class="cell closed flag"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell mine"></button>
    <button type="button" class="cell closed"></button>

    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed flag"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell open">1</button>
    <button type="button" class="cell open">2</button>
    <button type="button" class="cell open">1</button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>

    <button type="button" class="cell closed"></button>
    <button type="button" class="cell mine"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell open">1</button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed flag"></button>
    <button type="button" class="cell closed"></button>

    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell mine"></button>
    <button type="button" class="cell open">1</button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>

    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed flag"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>
    <button type="button" class="cell closed"></button>
  </div>

  <p id="game-message" role="status" aria-live="polite"></p>
</main>

</body>
</html>

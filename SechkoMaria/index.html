<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <div class="game-container">
        <header class="game-header">
            <div class="counter" id="flags-count">015</div>
            <button class="smile-btn" id="smile-btn" type="button" aria-label="Перезапустити гру">🙂</button>
            <div class="counter" id="timer">000</div>
        </header>

        <main>
            <p id="game-message" role="status" aria-live="polite"></p>

            <div class="grid" id="grid">
                </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>

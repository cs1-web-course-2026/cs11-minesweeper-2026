<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапер</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="game-container">
        
        <header class="game-header">
            <div class="counter">010</div>
            <button class="smile-btn" aria-label="Почати нову гру">😊</button>
            <div class="timer">000</div>
        </header>

        <section class="grid" aria-label="Ігрове поле">
            <button class="cell" aria-label="Закрита клітинка"></button>
            <button class="cell open" aria-label="Відкрита порожня клітинка"></button>
            <button class="cell open text-blue">1</button>
            <button class="cell open text-green">2</button>
            
            <button class="cell" aria-label="Клітинка з прапорцем">🚩</button>
            <button class="cell open" aria-label="Міна">💣</button>
            <button class="cell open boom" aria-label="Міна, що вибухнула">💥</button>
            <button class="cell"></button>
            
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </section>

    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - Humen Valeriia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        
        <header class="game-header">
            <div id="timer" class="status-item timer">000</div>
            
            <button type="button" id="reset-btn" class="reset-button" aria-label="Restart game">😊</button>
            
            <div id="mines-count" class="status-item flags-count">010</div>
        </header>
        
        <main id="grid" class="game-board"></main>
        
        <p id="game-message" role="status" aria-live="polite" class="visually-hidden"></p>
        
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="game-container">
        
        <header class="game-header">
            <div class="mines-count">💣 010</div>
            <button class="restart-btn">🙂</button>
            <div class="game-timer">⏱️ 000</div>
        </header>

        <section class="game-board">
            <button class="cell"></button>
            
            <button class="cell cell--opened"></button>
            
            <button class="cell cell--opened cell--number-1">1</button>
            <button class="cell cell--opened cell--number-2">2</button>
            <button class="cell cell--opened cell--number-3">3</button>
            
            <button class="cell cell--flagged">🚩</button>
            
            <button class="cell cell--mine">💣</button>
            
            <button class="cell cell--mine-exploded">💥</button>
            
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </section>

    </main>

</body>
</html>

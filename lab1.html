<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper Anton Medvediev</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <div class="flag-counter">🚩 010</div>
             <button class="start-btn">😊</button>
              <div class="timer">⏱ 000</div>
             </header>

        <main class="game-board">
            <div class="cell"></div> 
            <div class="cell open">1</div> 
            <div class="cell flag">🚩</div> 
            <div class="cell mine">💣</div> 
            <div class="cell mine exploded">💥</div> 
        </main>
    </div>
</body>
</html>

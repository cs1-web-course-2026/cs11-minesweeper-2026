<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper UI - German Pichoyan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <header class="game-header">
            <div class="stat-box">🚩 <span>010</span></div>
            <button class="reset-btn">NEW GAME</button>
            <div class="stat-box">⏱️ <span>000</span></div>
        </header>

        <main class="grid">
            <div class="cell closed"></div>             <div class="cell opened">1</div>           <div class="cell closed flag"></div>       <div class="cell opened wrong-flag"></div> <div class="cell opened mine"></div>       <div class="cell opened mine exploded"></div> <div class="cell closed"></div><div class="cell closed"></div>
            <div class="cell closed"></div><div class="cell closed"></div>
        </main>
    </div>
</body>
</html>

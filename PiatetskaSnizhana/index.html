<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - Сніжана П'ятецька</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="display flags-count">010</div>
            <button class="start-btn">😃</button>
            <div class="display timer">000</div>
        </div>

        <div class="board">
            <div class="cell"></div>
            <div class="cell revealed"></div>
            <div class="cell revealed text-blue">1</div>
            <div class="cell revealed text-green">2</div>
            
            <div class="cell flag">🚩</div>
            <div class="cell revealed false-flag">🚩</div>
            
            <div class="cell revealed mine">💣</div>
            <div class="cell revealed mine exploded">💣</div>
            
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
    </div>
</body>
</html>
